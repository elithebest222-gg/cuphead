<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Cuphead </title>
    <style>
        body { background-color: black; margin: 0; padding: 0; overflow: hidden; }
        #gameContainer { width: 100vw !important; height: 100vh !important; }
        canvas { width: 100% !important; height: 100% !important; }
        #loading-text {
            font-weight: bold;
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 3s ease infinite;
            font-size: 48px;
            font-family: cursive;
            text-align: center;
            margin-top: 20px;
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div id="loading-text">LOADING... 0.00 MB / 2101.31 MB</div>
    <div id="gameContainer"></div>

    <script src="Build/UnityLoader.js"></script>
    <script>
        var loadingText = document.querySelector("#loading-text");
        let loadedBytes = 0;

        async function fetchWithProgress(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to fetch ${url}`);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);
                
                let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
                let mbTotal = '2101.31';
                loadingText.textContent = `LOADING ASSETS... ${mbDone} MB / ${mbTotal} MB`;
            }

            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }

        async function mergeFiles(fileParts, cacheKey) {
            const cache = await caches.open("cuphead-cache");
            const cachedResponse = await cache.match(cacheKey);
            if (cachedResponse) {
                // Update total file tracking so math doesn't stall if reading from cache
                const blob = await cachedResponse.blob();
                loadedBytes += blob.size; 
                return URL.createObjectURL(blob);
            }

            const buffers = await Promise.all(
                fileParts.map(part => fetchWithProgress(part))
            );
            const mergedBlob = new Blob(buffers);
            const response = new Response(mergedBlob);
            await cache.put(cacheKey, response);
            return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        (async () => {
            try {
                // 1. Fetch and merge chunked game assets
                const [dataUrl, wasmUrl, asmUrl] = await Promise.all([
                    mergeFiles(getParts("Build/CupheadPort.data.unityweb", 1, 103), "CupheadPort.data.unityweb"),
                    mergeFiles(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2), "CupheadPort.wasm.code.unityweb"),
                    mergeFiles(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3), "CupheadPort.asm.code.unityweb"),
                ]);

                // 2. Intercept XMLHttpRequest to serve merged blobs
                const originalOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function (method, url, ...rest) {
                    if (url.includes("CupheadPort.data.unityweb")) {
                        url = dataUrl;
                    } else if (url.includes("CupheadPort.wasm.code.unityweb")) {
                        url = wasmUrl;
                    } else if (url.includes("CupheadPort.asm.code.unityweb")) {
                        url = asmUrl;
                    }
                    return originalOpen.call(this, method, url, ...rest);
                };

                loadingText.textContent = "LAUNCHING GAME...";

                // 3. Instantiate Unity and handle final completion cleanup
                var unityInstance = UnityLoader.instantiate("gameContainer", "Build/CupheadPort.json", {
                    onProgress: function(instance, progress) {
                        if (progress === 1) {
                            setTimeout(() => {
                                if(loadingText) loadingText.remove();
                            }, 1000); // Gives WebGL engine 1 second to draw the initial screen canvas safely
                        } else {
                            loadingText.textContent = "COMPILING ENGINE... " + Math.round(progress * 100) + "%";
                        }
                    }
                });
            } catch (err) {
                loadingText.textContent = "ERROR LOADING GAME: " + err.message;
                console.error(err);
            }
        })();
    </script>
</body>
</html>
